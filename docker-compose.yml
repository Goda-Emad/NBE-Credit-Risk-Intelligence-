# =============================================================================
# NBE Credit Risk Intelligence - Docker Compose
# =============================================================================

version: '3.8'

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nbe-credit-risk-app
    image: nbe-credit-risk:3.0
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./logs:/app/logs
      - ./reports:/app/reports
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_THEME_PRIMARY_COLOR=#006341
      - MODEL_VERSION=v3.0
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - nbe-network

  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nbe-credit-risk-monitor
    command: >
      python -c "
      from mlops.monitoring import ModelMonitor;
      import time;
      m = ModelMonitor();
      print('Monitor started');
      while True:
          alerts = m.check_alerts();
          if alerts: print(f'ALERTS: {len(alerts)}');
          time.sleep(3600)
      "
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - nbe-network

networks:
  nbe-network:
    driver: bridge

volumes:
  logs:
    driver: local
  reports:
    driver: local
